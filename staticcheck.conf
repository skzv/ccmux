# staticcheck configuration (run by `make staticcheck` and CI's lint job).
#
# Default checks, minus ST1005: several user-facing errors start with an
# agent's proper name ("Gemini project directory is unknown", "Cursor
# project directory … not found") or are full sentences shown verbatim
# in the TUI, and lower-casing them would read worse to the user.
checks = ["inherit", "-ST1005"]
