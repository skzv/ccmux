id = "claude"

# Highest priority: OSC-title spinner. The Phase 1 PR added this
# signal explicitly for claude; rules here keep that semantic.
[[rules]]
id = "title_spinner_working"
state = "working"
priority = 1100
region = "osc_title"
regex = ['^[\x{2800}-\x{28FF}]']

# Rounded box-drawing prompt frame on the last non-empty line of the
# pane. Mirrors looksLikeClaudePrompt's contract exactly: at least one
# rounded corner from ╭╮╰╯ AND a second DISTINCT glyph from {╭╮╰╯│─>}.
# The top-level regex requires the rounded corner; the `any` block
# requires the second distinct glyph — either one of the non-rounded
# frame glyphs, or a different rounded corner (all six unordered
# pairs enumerated). A lone `╰` — a capture racing a partial frame
# redraw — must NOT match; the old encoding let one rounded glyph
# satisfy both conditions and fired spurious needs_input bells.
#
# require_idle keeps the legacy idle-gate semantics: a prompt frame
# only means "blocked" once the pane has also been quiet for the idle
# threshold (engineClassify holds the frame as active until then).
[[rules]]
id = "claude_prompt_frame"
state = "blocked"
priority = 900
region = "last_line"
require_idle = true
regex = ['[╭╮╰╯]']
any = [
  { regex = ['│'] },
  { regex = ['─'] },
  { regex = ['>'] },
  { all = [{ regex = ['╭'] }, { regex = ['╮'] }] },
  { all = [{ regex = ['╭'] }, { regex = ['╰'] }] },
  { all = [{ regex = ['╭'] }, { regex = ['╯'] }] },
  { all = [{ regex = ['╮'] }, { regex = ['╰'] }] },
  { all = [{ regex = ['╮'] }, { regex = ['╯'] }] },
  { all = [{ regex = ['╰'] }, { regex = ['╯'] }] },
]

# Claude Code v2.x input box. v2 dropped the rounded frame: the prompt
# is a `❯` line (followed by a non-breaking space in real captures)
# sandwiched between two full-width `────` rules, with footer line(s)
# below — `⏵⏵ auto mode on (shift+tab to cycle) · ← for agents`,
# `? for shortcuts`, a statusline. The v1 rule above never fires on it:
# the last line is the footer and there are no rounded corners.
# Pinned by internal/agent/testdata/panes/claude_v2_idle.txt (a real
# 2.1.281 capture).
#
# The region is wide enough for a multi-line typed prompt plus the
# footer. The box stays on screen while Claude works (the spinner line
# sits above it), so require_idle is what separates "working" from
# "waiting": the spinner's elapsed-time counter repaints every second,
# which keeps the pane from ever going quiet mid-turn.
[[rules]]
id = "claude_prompt_frame_v2"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(12)"
require_idle = true
regex = ['(?m)^[ \t]*─{10,}[^\n]*\n[ \t]*[❯>](?:[ \t\x{00A0}][^\n]*)?\n(?:[^\n]*\n)*?[ \t]*─{10,}']

# Claude Code v2.x dialogs that replace the input box: tool permission
# prompts ("Do you want to proceed?" over a numbered `❯ 1. Yes`
# selector) and confirm dialogs such as the workspace trust check,
# whose footer is the `Enter to confirm · Esc to cancel` chord hint.
# Same idle gate as the input box.
[[rules]]
id = "claude_dialog_v2"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(12)"
require_idle = true
any = [
  { contains = ["Do you want to proceed?"] },
  { line_regex = ['^[\s\x{00A0}]*❯[\s\x{00A0}]*\d+\.[\s\x{00A0}]'] },
  { all = [{ contains = ["Enter to confirm"] }, { contains = ["Esc to cancel"] }] },
]

# Shell prompt at the tail = claude crashed. Only when the bottom of
# the pane shows no Claude chrome: Claude's own footer or a statusline
# can end in `%` (`Context left until auto-compact: 7%`, `ctx 42%`),
# and matching the bare last line turned a healthy session red. The
# input box's `────` rules, rounded corners, `❯` and the `⏵⏵` mode
# footer all veto.
[[rules]]
id = "claude_shell_prompt"
state = "error"
priority = 800
region = "bottom_non_empty_lines(4)"
regex = ['[\$#%]\s*\z']
not = [
  { regex = ['[╭╮╰╯]'] },
  { regex = ['─{10,}'] },
  { regex = ['[❯⏵]'] },
]
