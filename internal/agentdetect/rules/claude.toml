id = "claude"

# Highest priority: OSC-title spinner. The Phase 1 PR added this
# signal explicitly for claude; rules here keep that semantic.
[[rules]]
id = "title_spinner_working"
state = "working"
priority = 1100
region = "osc_title"
regex = ['^[\x{2800}-\x{28FF}]']

# Claude Code v1 rounded prompt frame on the last non-empty line of the
# pane. Mirrors looksLikeClaudePrompt exactly: the line must START
# (after indentation) with a real frame border — a left rounded corner
# `╭`/`╰` followed by a run of at least three `─`, or by a closing
# corner `╮`/`╯` joined to it by nothing but `─`.
#
# "A rounded corner plus any second frame glyph" was too loose twice
# over. A lone `╰` from a capture racing a partial frame redraw must not
# match, and neither may a modern shell prompt left behind after Claude
# crashed: powerlevel10k's framed prompt ends in `╰─❯ ` and oh-my-zsh
# themes such as bira in `╰─$ `. Those follow the corner with a single
# `─` and then the prompt glyph, never a border run.
#
# require_idle keeps the legacy idle-gate semantics: a prompt frame
# only means "blocked" once the pane has also been quiet for the idle
# threshold (engineClassify holds the frame as active until then).
[[rules]]
id = "claude_prompt_frame"
state = "blocked"
priority = 900
region = "last_line"
require_idle = true
regex = ['^[ \t]*[╭╰](?:─{3,}|─*[╮╯])']

# Claude Code v2.x input box. v2 dropped the rounded frame: the prompt
# is a `❯` line (followed by a non-breaking space in real captures)
# sandwiched between two full-width `────` rules, with footer line(s)
# below — `⏵⏵ auto mode on (shift+tab to cycle) · ← for agents`,
# `? for shortcuts`, a statusline. The v1 rule above never fires on it:
# the last line is the footer and there are no rounded corners.
# Pinned by internal/agent/testdata/panes/claude_v2_idle.txt (a real
# 2.1.281 capture).
#
# The region is wide enough for a multi-line typed prompt plus the
# footer. The box stays on screen while Claude works (the spinner line
# sits above it), so require_idle is what separates "working" from
# "waiting": the spinner's elapsed-time counter repaints every second,
# which keeps the pane from ever going quiet mid-turn.
[[rules]]
id = "claude_prompt_frame_v2"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(12)"
require_idle = true
regex = ['(?m)^[ \t]*─{10,}[^\n]*\n[ \t]*[❯>](?:[ \t\x{00A0}][^\n]*)?\n(?:[^\n]*\n)*?[ \t]*─{10,}']

# Claude Code v2.x dialogs that replace the input box: tool permission
# prompts ("Do you want to proceed?" over a numbered `❯ 1. Yes`
# selector) and confirm dialogs such as the workspace trust check,
# whose footer is the `Enter to confirm · Esc to cancel` chord hint.
# Same idle gate as the input box.
[[rules]]
id = "claude_dialog_v2"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(12)"
require_idle = true
any = [
  { contains = ["Do you want to proceed?"] },
  { line_regex = ['^[\s\x{00A0}]*❯[\s\x{00A0}]*\d+\.[\s\x{00A0}]'] },
  { all = [{ contains = ["Enter to confirm"] }, { contains = ["Esc to cancel"] }] },
]

# Shell prompt at the tail = Claude died and the launch chain fell
# through to a shell (`claude --continue || claude || zsh || …`). The
# prompt shapes, each anchored to the end of the last line (mirrored by
# looksLikeShellPrompt in internal/claude):
#
#   - `$` / `#` / `%` — bash, root, stock zsh.
#   - `❯` — the starship, pure and powerlevel10k prompt char, bare
#     (`❯ `) or behind p10k's frame (`╰─❯ `).
#   - oh-my-zsh's default theme, `➜  demo git:(main) ✗ ` — an arrow at
#     the START of the line, then the directory and optional git info.
#
# Only when the bottom of the pane shows no Claude chrome: Claude's own
# footer or a statusline can end in `%` (`Context left until
# auto-compact: 7%`, `ctx 42%`), and matching the bare last line turned
# a healthy session red. What vetoes is Claude's actual furniture, not
# any glyph it happens to share with a prompt theme:
#
#   - a v1 frame border line, the claude_prompt_frame shape (a p10k
#     `╭─ ~/demo  main` line starts with a corner too, but then a
#     single `─` and text);
#   - a v2 input-box rule: a line that begins with ten or more `─` (a
#     p10k "solid" connection line has its `─` run mid-line);
#   - the v2 `⏵⏵` mode footer.
#
# `❯` alone no longer vetoes. Claude's v2 input line always sits between
# two of those rules, so a `❯` with no rule next to it is a shell prompt.
[[rules]]
id = "claude_shell_prompt"
state = "error"
priority = 800
region = "bottom_non_empty_lines(4)"
any = [
  { regex = ['[\$#%]\s*\z'] },
  { regex = ['❯[\s\x{00A0}]*\z'] },
  { regex = ['(?m)^[ \t]*➜[ \t]+(?:\S+(?:[ \t]+git:\([^)\n]*\))?(?:[ \t]+✗)?)?\s*\z'] },
]
not = [
  { regex = ['(?m)^[ \t]*[╭╰](?:─{3,}|─*[╮╯])'] },
  { regex = ['(?m)^[ \t]*─{10,}'] },
  { regex = ['⏵'] },
]
